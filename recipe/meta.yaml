{% set name = "pylru" %}
{% set version = "1.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ad610b227999da4e2cbaf68a6adf7b57ff69a3e3839ff0f86210dc2f5ebddcdd

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - pylru

about:
  home: https://github.com/jlhutch/pylru
  license: GPL-2.0
  license_file: LICENSE.txt
  summary: A least recently used (LRU) cache implementation

extra:
  recipe-maintainers:
    - nehaljwani
